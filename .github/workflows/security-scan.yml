name: 🛡️ Automated Security Audit & Vulnerability Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security scan every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  backend-security-audit:
    name: 🔒 Backend Dependency & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --prefer-offline

      - name: 🔍 NPM Security Audit (High & Critical Filter)
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: 🛡️ Snyk Vulnerability Scan (Backend)
        uses: snyk/actions/node@master
        continue-on-error: true # Prevents workflow failure if SNYK_TOKEN is unconfigured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high ./backend

  frontend-security-audit:
    name: 🔒 Frontend Dependency & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline

      - name: 🔍 NPM Security Audit (High & Critical Filter)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: 🛡️ Snyk Vulnerability Scan (Frontend)
        uses: snyk/actions/node@master
        continue-on-error: true # Prevents workflow failure if SNYK_TOKEN is unconfigured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high ./frontend

  codeql-static-analysis:
    name: 🧬 CodeQL Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: 🔍 Perform CodeQL Security Analysis
        uses: github/codeql-action/analyze@v3
