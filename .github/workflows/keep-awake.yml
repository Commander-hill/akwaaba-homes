name: Keep Backend Awake
 
on:
  schedule:
    - cron: "0 * * * *" # Runs hourly to keep Hugging Face Space active
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          TARGET_URL="${HF_SPACE_URL:-https://akwaaba-homes-api.hf.space}"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/api/health" || true)
          echo "Pinging backend at $TARGET_URL/api/health -> HTTP $STATUS_CODE"
