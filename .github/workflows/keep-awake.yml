name: Keep Render Awake

on:
  schedule:
    - cron: "*/14 * * * *" # Runs every 14 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frontend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://akwaaba-homes-frontend.onrender.com
          echo " Pinging frontend complete!"
          
      - name: Ping Backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://akwaaba-homes-backend.onrender.com/api/health
          echo " Pinging backend complete!"
