name: Sync Backend to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - production
    paths:
      - 'backend/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    if: "${{ env.HF_TOKEN != '' }}"
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ secrets.HF_SPACE }} # e.g. username/akwaaba-homes-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Push backend subtree to Hugging Face Space
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE secret not configured. Skipping automated sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=backend -b hf-backend-deploy
          git push --force "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" hf-backend-deploy:main
