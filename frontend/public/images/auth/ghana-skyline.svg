<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120" fill="none">
  <!-- Ghana Star on Arch pillar -->
  <g opacity="0.12" fill="#16A34A">
    <!-- Independence Arch outline -->
    <rect x="310" y="40" width="80" height="70" rx="2"/>
    <rect x="325" y="20" width="50" height="25" rx="2"/>
    <rect x="338" y="10" width="24" height="14" rx="1"/>
    <!-- Star on top -->
    <polygon points="350,2 352,8 358,8 353,12 355,18 350,14 345,18 347,12 342,8 348,8" fill="#16A34A"/>
    <!-- Arch opening -->
    <rect x="328" y="55" width="44" height="35" rx="22" fill="white"/>
    <!-- Arch pillars -->
    <rect x="320" y="55" width="14" height="55"/>
    <rect x="366" y="55" width="14" height="55"/>

    <!-- City buildings left -->
    <rect x="50" y="60" width="30" height="50" rx="2"/>
    <rect x="90" y="45" width="25" height="65" rx="2"/>
    <rect x="125" y="55" width="35" height="55" rx="2"/>
    <rect x="170" y="35" width="20" height="75" rx="2"/>
    <rect x="200" y="50" width="28" height="60" rx="2"/>
    <rect x="238" y="65" width="22" height="45" rx="2"/>
    <rect x="270" y="70" width="18" height="40" rx="2"/>

    <!-- City buildings right -->
    <rect x="410" y="70" width="18" height="40" rx="2"/>
    <rect x="438" y="65" width="22" height="45" rx="2"/>
    <rect x="470" y="50" width="28" height="60" rx="2"/>
    <rect x="508" y="35" width="20" height="75" rx="2"/>
    <rect x="538" y="55" width="35" height="55" rx="2"/>
    <rect x="583" y="45" width="25" height="65" rx="2"/>
    <rect x="618" y="60" width="30" height="50" rx="2"/>

    <!-- Trees -->
    <circle cx="30" cy="68" r="12"/>
    <rect x="27" y="76" width="6" height="14"/>
    <circle cx="670" cy="68" r="12"/>
    <rect x="667" y="76" width="6" height="14"/>
    <circle cx="238" cy="78" r="8"/>
    <rect x="235" y="84" width="6" height="10"/>
    <circle cx="462" cy="78" r="8"/>
    <rect x="459" y="84" width="6" height="10"/>

    <!-- Ground line -->
    <rect x="0" y="110" width="700" height="2"/>
  </g>
</svg>
